<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration - Lab Archive</title>
    <style>
        :root {
            --primary-blue: #2563eb;
            --primary-dark: #1e40af;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .info-header {
            background: white;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .info-header div span {
            color: var(--primary-blue);
            font-weight: 600;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 24px;
            text-align: center;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-blue);
            margin-top: 0;
        }

        h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        p { margin: 0 0 16px 0; }

        .btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: var(--primary-blue);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.875rem;
            transition: background-color 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn:hover { background-color: var(--primary-dark); }

        .button-container {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        hr {
            border: none;
            height: 1px;
            background-color: var(--border-color);
            margin: 24px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        tr:nth-child(even) { background-color: #f8fafc; }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .image-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }

        iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 12px;
            box-shadow: var(--shadow);
            background: #000;
        }
    </style>
    <style>
        .form-box {
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            text-align: left;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        label {
            font-weight: 500;
            display: block;
            margin-top: 15px;
            color: var(--text-main);
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 10px;
            box-sizing: border-box;
        }

        .form-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            gap: 15px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #28a745, #1e7e34) !important;
            flex: 1;
        }

        .reset-btn {
            background: linear-gradient(135deg, #dc3545, #a71d2a) !important;
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="info-header">
        <div>Name: <span>Ashay Vitthal Patakare</span></div>
        <div>Roll No: <span>56</span> | Batch: <span>S3</span></div>
        <div>Experiment No: <span>9</span></div>
    </div>

    <hr>

    <div class="container">
        <h1>Employee Registration Form</h1>

        <div class="form-box">
            <h2>Registration Details</h2>
            <form>
                <label>Employee Name:</label>
                <input type="text" name="ename">

                <label>Employee ID:</label>
                <input type="text" name="eid">

                <label>Email:</label>
                <input type="email" name="email">

                <label>Mobile Number:</label>
                <input type="tel" name="mobile">

                <label>Gender:</label>
                <div style="margin: 10px 0;">
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </div>

                <label>Department:</label>
                <select name="dept">
                    <option>HR</option>
                    <option>IT</option>
                    <option>Sales</option>
                    <option>Finance</option>
                </select>

                <label>Address:</label>
                <textarea rows="4"></textarea>

                <div class="form-buttons">
                    <input type="submit" value="Register" class="btn submit-btn">
                    <input type="reset" value="Clear" class="btn reset-btn">
                </div>
            </form>
        </div>

        <div class="button-container">
            <a href="../Experiment_8/table.html" class="btn">⬅ Back</a>
            <a href="../index.html" class="btn">🏠 Home</a>
            <a href="../Experiment_10/Resume.html" class="btn">Continue ➡</a>
        </div>
    </div>

</body>
</html>
